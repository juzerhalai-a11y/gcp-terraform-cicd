# cloudbuild.yaml

steps:
  # Step 1: Build the Docker container image from the root directory
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker build'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-docker-repo/webapp:latest'
      - '.'

  # Step 2: Push the built Docker image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker push'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-docker-repo/webapp:latest'

  # Step 3: Initialize Terraform (connects to the remote GCS backend and downloads providers)
  - name: 'hashicorp/terraform:1.7.0'
    id: 'terraform init'
    args: ['init']

  # Step 4: Fetch GKE Cluster Credentials so the Kubernetes provider knows how to connect
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'gke credentials'
    entrypoint: 'gcloud'
    args:
      - 'container'
      - 'clusters'
      - 'get-credentials'
      - 'wiz-private-k8s-cluster'
      - '--zone'
      - 'us-central1-a'
      - '--project'
      - '$PROJECT_ID'

  # Step 5: Generate and preview the execution plan for infrastructure changes
  - name: 'hashicorp/terraform:1.7.0'
    id: 'terraform plan'
    args: ['plan']

  # Step 6: Automatically apply the changes to provision/update your GCP resources
  - name: 'hashicorp/terraform:1.7.0'
    id: 'terraform apply'
    args: ['apply', '-auto-approve']

# Root-level options block (placed outside the steps block)
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/my-docker-repo/webapp:latest'